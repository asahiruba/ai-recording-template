name: ルールの同期

# テンプレートのルールを写し、プルリクエストにする。内容を確認してから取り込む（Merge）。
on:
  workflow_dispatch:
    inputs:
      template_ref:
        description: 取り込むテンプレートのコミットID（空欄ならテンプレートの最新）
        required: false
        type: string

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: テンプレートを取得する
        env:
          # テンプレートが Private の場合だけ、読み取り用のトークンを RULES_TOKEN として登録する
          RULES_TOKEN: ${{ secrets.RULES_TOKEN }}
          TEMPLATE_REF: ${{ inputs.template_ref }}
        run: |
          TEMPLATE=$(python -c "import json; print(json.load(open('recording.json')).get('template_repo', ''))" 2>/dev/null || true)
          if [ -z "$TEMPLATE" ]; then
            echo "::error::recording.json に template_repo がありません。先に「初期設定」を実行してください。"
            exit 1
          fi
          if ! printf '%s' "$TEMPLATE" | grep -Eq '^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+$'; then
            echo "::error::recording.json の template_repo（${TEMPLATE}）は OWNER/NAME の形で書きます。"
            exit 1
          fi
          if [ -n "$TEMPLATE_REF" ] && ! printf '%s' "$TEMPLATE_REF" | grep -Eq '^[0-9a-f]{7,40}$'; then
            echo "::error::コミットID（${TEMPLATE_REF}）は、7〜40文字の英小文字と数字で入れます。"
            exit 1
          fi
          # トークンは URL に入れず、この clone の間だけヘッダーとして渡す（ディスクに残さない）
          AUTH=()
          if [ -n "$RULES_TOKEN" ]; then
            BASIC=$(printf 'x-access-token:%s' "$RULES_TOKEN" | base64 -w0)
            echo "::add-mask::$BASIC"
            AUTH=(-c "http.https://github.com/.extraheader=AUTHORIZATION: basic $BASIC")
          fi
          DIR="$RUNNER_TEMP/template"
          if ! git "${AUTH[@]}" clone -q "https://github.com/${TEMPLATE}.git" "$DIR"; then
            echo "::error::テンプレート（${TEMPLATE}）を取得できませんでした。Private の場合は RULES_TOKEN を登録してください。"
            exit 1
          fi
          if [ -n "$TEMPLATE_REF" ]; then
            # テンプレートの既定のブランチに含まれるコミットだけを受け付ける
            if ! SHA=$(git -C "$DIR" rev-parse --verify -q "${TEMPLATE_REF}^{commit}") \
               || ! git -C "$DIR" merge-base --is-ancestor "$SHA" HEAD; then
              echo "::error::コミット ${TEMPLATE_REF} がテンプレートの既定のブランチに見つかりません。"
              exit 1
            fi
            git -C "$DIR" checkout -q --detach "$SHA"
          fi
          {
            echo "TEMPLATE=$TEMPLATE"
            echo "TEMPLATE_SHA=$(git -C "$DIR" rev-parse HEAD)"
            echo "TEMPLATE_SHORT=$(git -C "$DIR" rev-parse --short=7 HEAD)"
          } >> "$GITHUB_ENV"

      - name: ルールを写す
        run: python scripts/sync_rules.py "$RUNNER_TEMP/template" | tee "$RUNNER_TEMP/sync.log"

      - name: 確認用のプルリクエストを作る
        env:
          GH_TOKEN: ${{ github.token }}
          BASE: ${{ github.event.repository.default_branch }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "ルールは最新です（テンプレート ${TEMPLATE_SHORT}）" | tee -a "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          BRANCH="rules-sync/${TEMPLATE_SHORT}"
          git switch -q -c "$BRANCH"
          git commit -q -m "ルールを同期（テンプレート ${TEMPLATE_SHORT}）"
          # 同期用のブランチだけを書き換える（main には直接書き込まない）
          git push -q --force origin "HEAD:refs/heads/${BRANCH}"

          BODY="$RUNNER_TEMP/body.md"
          {
            echo "テンプレート [${TEMPLATE}@${TEMPLATE_SHORT}](https://github.com/${TEMPLATE}/commit/${TEMPLATE_SHA}) のルールを写しました。"
            echo
            echo "「Files changed」で内容を確認し、問題がなければ「Merge pull request」を押します。取り込まない場合は「Close pull request」を押します。"
            echo
            echo "## 変わるファイル"
            echo
            git diff --name-only HEAD~1 HEAD | sed 's/^/- `/; s/$/`/'
            if grep -q '^::notice::' "$RUNNER_TEMP/sync.log"; then
              echo
              echo "## 手で置き換えるファイル"
              echo
              grep '^::notice::' "$RUNNER_TEMP/sync.log" | sed 's/^::notice::/- /'
            fi
          } > "$BODY"
          cat "$BODY" >> "$GITHUB_STEP_SUMMARY"

          if [ -n "$(gh pr list --head "$BRANCH" --state open --json number --jq '.[].number')" ]; then
            echo "同じ版のプルリクエストがすでにあるため、その内容を更新しました。"
            exit 0
          fi
          if ! gh pr create --base "$BASE" --head "$BRANCH" \
               --title "ルールの同期（テンプレート ${TEMPLATE_SHORT}）" --body-file "$BODY"; then
            echo "::error::プルリクエストを作れませんでした。Settings → Actions → General の「Allow GitHub Actions to create and approve pull requests」をオンにして、もう一度実行してください（写した内容はブランチ ${BRANCH} にあります）。"
            exit 1
          fi
