name: 記録の索引を更新

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    # テンプレートのリポジトリ自身では動かさない
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@e797f83bcb11b83ae66e0230d6156d7c80228e7c # v6.0.0
        with:
          python-version: "3.12"

      - name: 必要なライブラリを入れる
        run: pip install pyyaml==6.0.2

      - name: 今回のプッシュで変わったファイルを調べる
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            git -c core.quotepath=off diff --name-status "$BEFORE" "$AFTER" > "$RUNNER_TEMP/changes.txt"
          else
            : > "$RUNNER_TEMP/changes.txt"
          fi

      # 記録が続けて保存されると、この処理も続けて動く。先に動いた処理の結果とぶつからないよう、
      # 毎回いちばん新しい main から生成し直してからプッシュする。
      - name: 最新の記録から生成し、結果をコミットする
        env:
          TZ: Asia/Tokyo
          COMMIT: ${{ github.sha }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for i in 1 2 3 4 5; do
            git fetch -q origin main
            git reset -q --hard origin/main
            python scripts/build_index.py --changes "$RUNNER_TEMP/changes.txt" --commit "$COMMIT"
            git add -A STATUS.md index themes
            if git diff --cached --quiet; then
              echo "変更はありません"
              exit 0
            fi
            git commit -q -m "記録の索引を更新"
            if git push -q origin HEAD:main; then
              exit 0
            fi
            echo "ほかの更新とぶつかったため、生成し直します（${i}回目）"
            sleep $((i * 3))
          done
          echo "::error::生成した結果をプッシュできませんでした"
          exit 1
