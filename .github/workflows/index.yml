name: 記録の索引を更新

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-index
  cancel-in-progress: false

jobs:
  build:
    # テンプレートのリポジトリ自身では動かさない
    if: ${{ !github.event.repository.is_template }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          fetch-depth: 0

      - uses: actions/setup-python@42375524e23c412d93fb67b49958b491fce71c38 # v5.4.0
        with:
          python-version: "3.12"

      - name: 必要なライブラリを入れる
        run: pip install pyyaml==6.0.2

      - name: 今回のプッシュで変わったファイルを調べる
        env:
          BEFORE: ${{ github.event.before }}
          AFTER: ${{ github.sha }}
        run: |
          if [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ] && git cat-file -e "$BEFORE" 2>/dev/null; then
            git -c core.quotepath=off diff --name-status "$BEFORE" "$AFTER" > "$RUNNER_TEMP/changes.txt"
          else
            : > "$RUNNER_TEMP/changes.txt"
          fi

      - name: STATUS.md と索引を生成し、形式を検査する
        env:
          TZ: Asia/Tokyo
        run: python scripts/build_index.py --changes "$RUNNER_TEMP/changes.txt" --commit "${{ github.sha }}"

      - name: 生成した結果をコミットする
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A STATUS.md index themes
          if git diff --cached --quiet; then
            echo "変更はありません"
            exit 0
          fi
          git commit -m "記録の索引を更新"
          for i in 1 2 3; do
            if git pull --rebase && git push; then exit 0; fi
            sleep 5
          done
          echo "::error::生成した結果をプッシュできませんでした"
          exit 1
